<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1D1072"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Premiação KK"><title>Calculadora de Premiação Mensal - KarneKeijo</title>
<style>
:root{--red:#E5000B;--red-d:#B8000A;--navy:#1D1072;--navy-d:#150C57;--bg:#F3F4F9;--card:#fff;--line:#DDE0EC;--txt:#1E2033;--mut:#5E637C;--ok:#0F7B3E;--okbg:#E6F5EC;--warn:#8A5A00;--warnbg:#FFF4D6;--err:#B00020;--errbg:#FDE8EB;--info-bg:#EAEDFB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header.top{background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:24px;padding:10px 28px;position:sticky;top:0;z-index:5}
header.top img{height:46px;display:block}
header.top .title{font-weight:700;color:var(--navy);font-size:17px;line-height:1.2}
header.top .title small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
header.top nav{margin-left:auto;display:flex;gap:6px}
nav button{background:none;border:0;font:inherit;font-weight:600;color:var(--navy);padding:8px 14px;border-radius:8px;cursor:pointer}
nav button:hover,nav button.on{background:var(--info-bg)}
main{max-width:1060px;margin:0 auto;padding:26px 24px 60px}
h1{font-size:24px;color:var(--navy);margin:0 0 4px}
h2{font-size:17px;color:var(--navy);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(29,16,114,.05)}
.card.locked{opacity:.5;pointer-events:none}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;margin-top:-2px}
.step.done .n{background:var(--ok)}
.step .body{flex:1;min-width:0}
.step h2{margin-bottom:8px}
label{display:block;font-weight:600;margin-bottom:6px}
select,input[type=text],input[type=month]{font:inherit;padding:11px 12px;border:1.5px solid #B9BED4;border-radius:8px;background:#fff;width:100%;max-width:520px;color:var(--txt)}
select:focus,input:focus,.drop:focus{outline:3px solid #B9B3F5;border-color:var(--navy)}
.money{position:relative;max-width:280px}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mut)}
.money input{padding-left:44px;font-size:20px;font-weight:700;text-align:right}
button.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--navy);color:#fff}
button.btn:hover{background:var(--navy-d)}
button.btn.red{background:var(--red)}button.btn.red:hover{background:var(--red-d)}
button.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button.btn.ghost:hover{background:var(--info-bg)}
button.btn.big{font-size:19px;padding:18px 34px;letter-spacing:.3px}
button.btn:disabled{background:#C9CCDA;color:#fff;cursor:not-allowed;border:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2.5px dashed #A9AEC9;border-radius:12px;padding:30px 20px;text-align:center;background:#FAFAFE;cursor:pointer}
.drop.over,.drop:hover{border-color:var(--red);background:#FFF5F5}
.drop b{color:var(--navy)}
.msg{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.msg.err{background:var(--errbg);color:var(--err);border:1px solid #F1B6BF}
.msg.warn{background:var(--warnbg);color:var(--warn);border:1px solid #F0D58A}
.msg.ok{background:var(--okbg);color:var(--ok);border:1px solid #A8DBBE}
.msg.info{background:var(--info-bg);color:var(--navy);border:1px solid #C5CBEF}
.msg ul{margin:4px 0 0 18px;padding:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:#FAFAFD}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.no{background:var(--errbg);color:var(--err)}.badge.mut{background:#ECEEF6;color:var(--mut)}
.ref{color:var(--mut);font-size:12px}
.home{text-align:center;padding:50px 20px}
.home img{width:min(420px,80%);margin-bottom:18px}
.home p{color:var(--mut);max-width:560px;margin:14px auto 26px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px}
.kv div:nth-child(odd){color:var(--mut);font-weight:600}
.final{background:linear-gradient(135deg,var(--navy),#2D1FA3);color:#fff;border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-left:8px solid var(--red)}
.final .lbl{font-size:13px;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.final .val{font-size:44px;font-weight:800;line-height:1.1}
.final .side{text-align:right;font-size:14px;opacity:.95}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.box .l{font-size:12.5px;color:var(--mut);font-weight:600}.box .v{font-size:22px;font-weight:800;color:var(--navy)}
.mem h3{margin:14px 0 4px;font-size:14.5px;color:var(--navy)}
.mem .ln{font-family:Consolas,"Courier New",monospace;font-size:13px;background:#F6F7FC;border-left:3px solid var(--navy);padding:3px 10px;margin:2px 0;word-break:break-word}
.stmt-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:14px}
.stmt-head img{height:52px}
.stmt-head .t{font-weight:800;color:var(--navy);font-size:18px}
.foot{color:var(--mut);font-size:12px;margin-top:14px}
details summary{cursor:pointer;font-weight:600;color:var(--navy);margin:6px 0}
.hide{display:none!important}
@media (max-width:760px){.grid3{grid-template-columns:1fr}.kv{grid-template-columns:1fr}header.top{flex-wrap:wrap}}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff}
  header.top,.no-print,nav{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0;margin:0 0 10px}
  .final{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{page-break-inside:avoid}
}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.previa-banner{background:var(--warnbg);color:#6B4300;border:2px solid #E8A200;border-radius:10px;padding:10px 14px;font-weight:700;margin:0 0 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
details.catblk{border:1px solid var(--line);border-radius:10px;padding:6px 14px 12px;margin:10px 0}
details.catblk>summary{font-size:16px;font-weight:700;color:var(--navy)}
h3.sub{font-size:14px;color:var(--navy);margin:12px 0 6px}
@media print{details.catblk{border:1px solid #bbb;page-break-inside:auto}}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);color:var(--navy);border-radius:99px;padding:3px 6px 3px 12px;margin:2px 4px 2px 0;font-size:13px;font-weight:600}
.chipx{border:0;background:none;cursor:pointer;color:var(--mut);font-size:12px}
.bar{height:5px;background:var(--red);border-radius:3px;margin-top:3px;margin-left:auto}
@media (max-width:760px){header.top{padding:8px 12px;gap:10px}header.top nav{margin-left:0;flex-wrap:wrap}nav button{padding:6px 9px;font-size:13px}main{padding:16px 12px 40px}.card{padding:14px}.final .val{font-size:34px}.row>div,select,input[type=text],input[type=month]{max-width:100%}}
.gchks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 14px}
.gchk{font-weight:500;display:flex;gap:8px;align-items:center;margin:2px 0;cursor:pointer}
details.dd{position:relative;min-width:230px}details.dd>summary{border:1.5px solid #B9BED4;border-radius:8px;padding:10px 12px;background:#fff;font-weight:500;color:var(--txt);list-style:none}
details.dd .ddl{position:absolute;z-index:4;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:8px 12px;max-height:260px;overflow:auto;min-width:260px}
table.conta{margin:8px 0}table.conta td:first-child{width:170px;color:var(--mut);font-weight:600}

</style>
</head>

/* Leitor e gravador de XLSX sem bibliotecas externas (tudo roda localmente, nada é enviado para fora). */
const KK_XLSX = (function () {
  const td = new TextDecoder('utf-8');
  const te = new TextEncoder();

  // ---------- ZIP ----------
  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());

  async function unzip(buffer) {
    const u8 = new Uint8Array(buffer);
    const dv = new DataView(buffer);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo ZIP/XLSX inválido (diretório central não encontrado).');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = {};
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Arquivo ZIP/XLSX corrompido.');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const loff = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(loff + 26, true);
      const lelen = dv.getUint16(loff + 28, true);
      const start = loff + 30 + lnlen + lelen;
      files[name] = { method, data: u8.subarray(start, start + csize) };
      p += 46 + nlen + elen + clen;

  }

  function parseSalario(txt) {

  function confirmarPad(substituir) {
    S.erroImport = '';
    const per = S.pad.periodo, pSel = S.periodoSel, tipo = S.tipoSel;
    const agora = new Date(), atual = agora.getFullYear() + '-' + pad2(agora.getMonth() + 1);
    if (per && pSel !== per.ano + '-' + pad2(per.mes)) S.erroImport = 'O período informado (' + mesTxt(pSel) + ') não corresponde ao título do arquivo (' + KK_PAD.MESES_NOME[per.mes - 1] + '/' + per.ano + '). Corrija o período ou escolha o arquivo certo.';
    else if (S.pad.periodo && S.pad.periodo.divergente) S.erroImport = 'As abas do arquivo apontam meses diferentes. Não é possível confirmar o arquivo.';
    else if (tipo === 'fechamento' && pSel >= atual) S.erroImport = 'O mês ' + mesTxt(pSel) + ' ainda não foi encerrado. Um PAD de fechamento é sempre de um mês anterior ao corrente. Se este é um PAD diário, marque a opção "PAD diário".';
    else if (tipo === 'diario' && S.posicaoSel.slice(0, 7) !== pSel) S.erroImport = 'A data de posição (' + fmtDia(S.posicaoSel) + ') está fora do mês de referência (' + mesTxt(pSel) + ').';
    if (S.erroImport) { S.fase = 'lido'; renderImport(); return; }
    const reg = store.get(KP, []);

    if (tipo === 'diario') { // prévia: não participa de substituição de fechamento
      const ja = reg.some((r) => r.hash === S.arq.hash && r.tipo === 'diario');
      if (!ja) { reg.push({ hash: S.arq.hash, nome: S.arq.nome, periodo: pSel, tipo: 'diario', posicao: S.posicaoSel, importadoEm: new Date().toISOString() }); store.set(KP, reg); }
      guardaSnapshot(S.pad, S.arq, pSel, S.posicaoSel);
      S.conflito = null; S.confirmado = { tipo: 'diario', nome: S.arq.nome, hash: S.arq.hash, periodo: pSel, posicao: S.posicaoSel, versao: null, jaImportado: ja }; S.fase = 'confirmado'; refresh(); return;
    }
    const ativo = reg.find((r) => r.periodo === pSel && r.tipo === 'fechamento' && !r.substituido);
    const mesmo = reg.find((r) => r.hash === S.arq.hash && r.periodo === pSel && r.tipo === 'fechamento');
    let rec, jaImportado = false;
    if (ativo && ativo.hash === S.arq.hash) { rec = ativo; jaImportado = true; }
    else if (ativo && !substituir) { S.conflito = ativo; S.fase = 'lido'; renderImport(); return; }
    else {
      if (ativo) { ativo.substituido = true; ativo.substituidoEm = new Date().toISOString(); }
      const nFech = reg.filter((r) => r.periodo === pSel && r.tipo === 'fechamento').length;
      if (mesmo) { mesmo.substituido = false; rec = mesmo; rec.versao = nFech + 1; rec.reativadoEm = new Date().toISOString(); jaImportado = true; }
      else { rec = { hash: S.arq.hash, nome: S.arq.nome, periodo: pSel, tipo: 'fechamento', importadoEm: new Date().toISOString(), versao: nFech + 1, substituido: false }; reg.push(rec); }
      store.set(KP, reg);
    }
    S.conflito = null; S.confirmado = { tipo: 'fechamento', nome: S.arq.nome, hash: S.arq.hash, periodo: pSel, versao: rec.versao, jaImportado }; S.fase = 'confirmado'; refresh();
  }

  // Executa e registra um cálculo (várias categorias) para um colaborador
  function executaLote(gs, cats, salCent, cargo, ajustes) {
    const c = S.confirmado, agora = new Date().toISOString();
    const ctx = { arquivo: c.nome, hash: c.hash, periodoISO: c.periodo, periodoTexto: mesTxt(c.periodo), versaoFechamento: c.versao, calculadoEm: agora, tipoPad: c.tipo, posicao: c.posicao || null, posicaoTexto: c.posicao ? fmtDia(c.posicao) : null, cargo, ajustes };
    const lote = M.calcularLote(gs, cats, salCent, ctx);
    if (!lote.ok) return { erro: lote };
    const loteId = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const hist = store.get(KH, []);
    const meta = { totalBrutoCent: lote.totalBrutoCent, ajustes: lote.ajustes, totalCent: lote.totalCent, totalProjCent: lote.totalProjCent, totalProjBrutoCent: lote.totalProjBrutoCent };
    const recs = lote.recs.map((r, i) => { const rec = { id: loteId + '-' + (i + 1), loteId, criadoEm: agora, resultado: r, falhas: lote.falhas, lote: meta }; hist.push(rec); return rec; });
    store.set(KH, hist);
    return { lote: { loteId, criadoEm: agora, recs, falhas: lote.falhas } };
  }

  async function importaDiarios(files) {
    S.ac.log = [];
    for (const f of files) {
      try {
        const { pad, arq } = await leituraPAD(f);
        const dia = dataDoNome(f.name);
        if (pad.erros.length) throw new Error(pad.erros.join(' '));
        if (pad.tipo.tipo !== 'diario') throw new Error('não parece um PAD diário (' + (pad.tipo.evidencias.join('; ') || 'tipo indefinido') + ').');
        if (!dia) throw new Error('não encontrei a data no nome do arquivo (esperado dd.mm.aaaa).');
        if (!pad.periodo || pad.periodo.ano + '-' + pad2(pad.periodo.mes) !== dia.slice(0, 7)) throw new Error('o mês do título da planilha não corresponde à data do nome do arquivo.');
        const r = guardaSnapshot(pad, arq, dia.slice(0, 7), dia);
        S.ac.log.push({ ok: true, texto: f.name + ': ' + (r === 'novo' ? 'guardado' : r === 'igual' ? 'já estava guardado (mesmo arquivo)' : 'substituiu o PAD anterior do mesmo dia') + ' (' + fmtDia(dia) + ').' });
      } catch (e) { S.ac.log.push({ ok: false, texto: f.name + ': ' + (e.message || e) }); }
    }
    renderAc1(); renderAc2();
  }
  function renderAc2() {
    const el = $('#ac2'); if (!el) return;
    const a = store.get(KA, { dias: {} }), dias = Object.keys(a.dias).sort();
    if (!dias.length) { el.innerHTML = ''; return; }
    const meses = [...new Set(dias.map((d) => d.slice(0, 7)))];
    if (!S.ac.mes || !meses.includes(S.ac.mes)) S.ac.mes = meses[meses.length - 1];
    const dm = dias.filter((d) => d.slice(0, 7) === S.ac.mes), ult = a.dias[dm[dm.length - 1]];
    const gs = ult.gestores;
    if (!gs.some((g) => g.codigo === S.ac.gestor)) S.ac.gestor = '';
    el.innerHTML = '<div class="card"><h2>Evolução no mês</h2><div class="row" style="align-items:flex-end"><div><label for="acm">Mês</label><select id="acm" style="width:180px">' + meses.map((m) => '<option value="' + m + '"' + (m === S.ac.mes ? ' selected' : '') + '>' + mesTxt(m) + '</option>').join('') + '</select></div>' +
      '<div><label for="acg">Gestor</label><select id="acg" style="width:280px"><option value="">Selecione...</option>' + gs.map((g) => '<option value="' + esc(g.codigo) + '"' + (g.codigo === S.ac.gestor ? ' selected' : '') + '>' + esc(g.codigo + ' - ' + g.nome) + '</option>').join('') + '</select></div>' +
      '<div><label for="acc">Cargo</label><select id="acc" style="width:160px"><option value="">Selecione...</option>' + CARGOS.map((c) => '<option ' + (S.ac.cargo === c ? 'selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
      '<div><label for="acs">Salário bruto (opcional)</label><div class="money" style="max-width:200px"><span>R$</span><input type="text" id="acs" inputmode="numeric" autocomplete="off" placeholder="0,00" style="font-size:16px"></div></div>' +
      '<button class="btn red" data-act="ver-evolucao">VER EVOLUÇÃO</button></div><div class="ref" style="margin-top:6px">Sem salário você vê só os atingimentos; com salário, também os valores em R$ (informado a cada consulta, nunca guardado).</div><div id="acres"></div></div>';
    $('#acm').onchange = (e) => { S.ac.mes = e.target.value; renderAc2(); };
    $('#acg').onchange = (e) => { S.ac.gestor = e.target.value; }; $('#acc').onchange = (e) => { S.ac.cargo = e.target.value; };
    const inp = $('#acs'); inp.oninput = () => { S.ac.salCent = mask(inp); };
  }
  function verEvolucao() {
    const a = store.get(KA, { dias: {} }), res = $('#acres');
    if (!S.ac.gestor) { res.innerHTML = '<div class="msg err">Escolha o gestor.</div>'; return; }
    const sal = S.ac.salCent, cargo = S.ac.cargo || 'Gestor';
    const dm = Object.keys(a.dias).filter((d) => d.slice(0, 7) === S.ac.mes).sort();
    const linhas = dm.map((dia) => {
      const snap = a.dias[dia], g = snap.gestores.find((x) => x.codigo === S.ac.gestor);
      if (!g) return { dia, erro: 'gestor não consta neste PAD' };
      const ctx = { arquivo: snap.nome, tipoPad: 'diario', posicao: dia, posicaoTexto: fmtDia(dia), periodoISO: snap.periodo, periodoTexto: mesTxt(snap.periodo), cargo, ajustes: {} };
      const lote = M.calcularLote(g, catsAplicaveis([g]).map((c) => c.id), sal || 100000, ctx);
      return { dia, lote };
    });
    const totais = linhas.map((l) => (l.lote && l.lote.ok ? l.lote.totalCent : 0)), max = Math.max(1, ...totais);
    const cab = R.categorias.map((c) => '<th class="num">' + esc(c.nome.replace(/ \(.*\)/, '')) + '</th>').join('');
    const corpo = linhas.map((l, i) => {
      if (l.erro || !l.lote.ok) return '<tr><td>' + fmtDia(l.dia) + '</td><td colspan="' + (R.categorias.length + 3) + '" class="ref">' + esc(l.erro || 'nenhuma categoria calculável') + '</td></tr>';
      const cels = R.categorias.map((c) => {
        const r = l.lote.recs.find((x) => x.categoriaId === c.id), f = l.lote.falhas.find((x) => x.categoriaId === c.id);
        if (r) return '<td class="num">' + M.fmtPct(r.indicadores[0].atingimento) + (sal ? '<div class="ref">' + M.fmtCent(r.valorCent) + '</div>' : '') + '</td>';
        return '<td class="num ref" title="' + esc(f ? f.bloqueios.join(' ') : '') + '">' + (f && f.tipo === 'negativo' ? 'negativo' : '—') + '</td>';
      }).join('');
      const ant = i > 0 && linhas[i - 1].lote && linhas[i - 1].lote.ok ? totais[i - 1] : null, d = ant === null ? null : totais[i] - ant;
      return '<tr><td><b>' + fmtDia(l.dia) + '</b></td>' + cels + (sal ? '<td class="num"><b>' + M.fmtCent(totais[i]) + '</b><div class="bar" style="width:' + Math.round(totais[i] / max * 100) + '%"></div></td><td class="num">' + (d === null ? '—' : (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '= ') + M.fmtCent(Math.abs(d))) + '</td><td class="num">' + (l.lote.totalProjCent == null ? '—' : M.fmtCent(l.lote.totalProjCent)) + '</td>' : '<td class="ref">informe o salário</td><td></td><td></td>') + '</tr>';
    }).join('');
    const ultimo = [...linhas].reverse().find((l) => l.lote && l.lote.ok);
    const prox = ultimo ? '<h3 class="sub">Para subir de faixa (posição de ' + fmtDia(ultimo.dia) + ')</h3><ul>' + ultimo.lote.recs.map((r) => { const p = r.proximos; return '<li><b>' + esc(r.categoriaNome) + ':</b> ' + (p.faixa ? 'faltam ' + M.fmtMoeda(p.faixa.falta) + ' para a faixa de ' + esc(p.faixa.rotulo) + ' (' + M.fmtPP(p.faixa.pct) + '%)' : 'já na faixa máxima') + (p.degrau ? '; escala: faltam ' + M.fmtMoeda(p.degrau.falta) + ' para "' + esc(p.degrau.rotulo) + '" (+' + M.fmtPP(p.degrau.add) + ' p.p.)' : '; escala no degrau máximo') + '.</li>'; }).join('') + '</ul>' + (ultimo.lote.falhas.length ? '<div class="ref">Fora do cálculo: ' + ultimo.lote.falhas.map((f) => esc(f.categoriaNome) + ' (' + (f.tipo === 'naoAplica' ? 'não se aplica' : f.tipo === 'negativo' ? 'atingimento negativo' : 'dado ausente') + ')').join('; ') + '.</div>' : '') : '';
    res.innerHTML = '<div class="msg warn" style="margin-top:12px"><b>Prévia não oficial.</b> Cada dia usa o PAD diário daquela data (acumulado do mês). A projeção mantém o ritmo atual. O valor oficial só sai com o PAD de fechamento.</div><div style="overflow:auto"><table><tr><th>Posição</th>' + cab + '<th class="num">Total (prévia)</th><th class="num">Variação</th><th class="num">Projeção fim do mês</th></tr>' + corpo + '</table></div><div class="ref">Células mostram o atingimento' + (sal ? ' e, abaixo, o prêmio da categoria' : '') + '. "negativo" = atingimento negativo, não calculado.</div>' + prox;
    S.ac.salCent = null; const inp = $('#acs'); if (inp) inp.value = ''; // salário descartado após a consulta
  }

  // ---------- HISTÓRICO + BACKUP ----------
  function viewHist() {
    const hist = store.get(KH, []).slice().reverse();
    let h = '<div class="row" style="margin-bottom:12px"><h1 style="margin:0">Histórico de cálculos</h1><span style="flex:1"></span>' + (hist.length ? '<button class="btn" data-act="xlsx-hist">Exportar histórico (Excel)</button>' : '') + '<button class="btn ghost" data-act="backup">Salvar backup</button><button class="btn ghost" data-act="restaurar">Restaurar backup</button><input type="file" id="bkfile" accept=".json" class="hide"></div>' +
      (S.msgHist ? '<div class="msg ' + (S.msgHist.ok ? 'ok' : 'err') + '">' + esc(S.msgHist.texto) + '</div>' : '') +
      '<p class="ref" style="margin-top:0">Cada linha guarda os dados originais do cálculo, com o prêmio de cada categoria antes dos ajustes. O salário mostrado é o informado naquele cálculo e nunca é reutilizado. "Prévia" = calculado com PAD diário (não oficial). O backup inclui os salários informados: guarde-o em local seguro.</p>';
    S.msgHist = null;
    if (!hist.length) h += '<div class="card">Nenhum cálculo realizado ainda neste computador.</div>';
    else h += '<div class="card" style="padding:0;overflow:auto"><table><tr><th>Data</th><th>Tipo</th><th>Mês ref.</th><th>Colaborador</th><th>Gestor</th><th>Categoria</th><th class="num">Salário informado</th><th class="num">Premiação</th><th>Arquivo PAD</th><th></th></tr>' +
      hist.map((x) => { const r = x.resultado, c = r.contexto; return '<tr><td>' + fmtData(x.criadoEm) + '</td><td>' + (r.previa ? '<span class="badge warn">Prévia ' + esc(c.posicaoTexto || '') + '</span>' : '<span class="badge ok">Oficial</span>') + '</td><td>' + esc(c.periodoTexto) + '</td><td>' + esc(r.cargo || 'Gestor') + '</td><td>' + esc(r.gestor.codigo + ' ' + r.gestor.nome) + '</td><td>' + esc(r.categoriaNome) + '</td><td class="num">' + M.fmtCent(r.salarioCent) + '</td><td class="num"><b>' + M.fmtCent(r.valorCent) + '</b></td><td class="ref">' + esc(c.arquivo) + '</td><td><button class="btn ghost" style="padding:6px 12px" data-ver="' + esc(x.id) + '">Ver memória</button></td></tr>'; }).join('') + '</table></div>';
    $('#main').innerHTML = h;
    const bk = $('#bkfile'); if (bk) bk.onchange = () => { if (bk.files[0]) importaBackup(bk.files[0]); };
  }
  function abreRegistro(id) {
    const hist = store.get(KH, []); const x = hist.find((h) => h.id === id); if (!x) return;
    const recs = x.loteId ? hist.filter((h) => h.loteId === x.loteId) : [x];
    S.lote = { loteId: x.loteId || x.id, criadoEm: x.criadoEm, recs, falhas: x.falhas || [] }; S.loteReadonly = true; go('res');
  }
  function exportaBackup() {
    const d = new Date(), dados = { app: 'kk-premiacao', versao: 1, geradoEm: d.toISOString(), historico: store.get(KH, []), pads: store.get(KP, []), acomp: store.get(KA, { dias: {} }) };
    baixa(new Blob([JSON.stringify(dados)], { type: 'application/json' }), 'Backup_Premiacao_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json');
  }
  async function importaBackup(file) {
    try {
      const d = JSON.parse(await file.text());
      if (!d || d.app !== 'kk-premiacao' || !Array.isArray(d.historico)) throw new Error('arquivo de backup inválido.');
      const hist = store.get(KH, []), ids = new Set(hist.map((x) => x.id)); let nh = 0;
      d.historico.forEach((x) => { if (x && x.id && !ids.has(x.id)) { hist.push(x); ids.add(x.id); nh++; } });
      hist.sort((a, b) => (a.criadoEm < b.criadoEm ? -1 : 1)); store.set(KH, hist);
      const reg = store.get(KP, []), chaves = new Set(reg.map((r) => r.hash + '|' + r.tipo + '|' + r.periodo + '|' + (r.posicao || ''))); let np = 0;
      (d.pads || []).forEach((r) => { const k = r.hash + '|' + r.tipo + '|' + r.periodo + '|' + (r.posicao || ''); if (!chaves.has(k)) { reg.push(r); chaves.add(k); np++; } });
      store.set(KP, reg);
      const ac = store.get(KA, { dias: {} }); let nd = 0;
      Object.keys((d.acomp && d.acomp.dias) || {}).forEach((dia) => { if (!ac.dias[dia]) { ac.dias[dia] = d.acomp.dias[dia]; nd++; } });
      store.set(KA, ac);
      S.msgHist = { ok: true, texto: 'Backup restaurado: ' + nh + ' cálculo(s), ' + np + ' PAD(s) e ' + nd + ' dia(s) de acompanhamento adicionados (o que já existia foi mantido).' };
    } catch (e) { S.msgHist = { ok: false, texto: 'Não foi possível restaurar o backup: ' + (e.message || e) }; }
    viewHist();
  }

  // ---------- EXPORTAÇÕES ----------
  function baixa(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  const slug = (s) => KK_PAD.norm(s).replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '').toLowerCase();
  const nomeBase = (L) => { const r = L.recs[0].resultado; return 'Premiacao_' + (r.previa ? 'PREVIA_' : '') + uniq(L.recs.map((x) => slug(x.resultado.gestor.codigo))).join('_') + '_' + (multiGestor(L) ? '' : slug(r.gestor.nome) + '_') + slug(r.cargo) + '_' + (L.recs.length > 1 ? 'multi' : r.categoriaId) + '_' + r.contexto.periodoISO; };
  function linhasLote(L) {
    const r0 = L.recs[0].resultado, c = r0.contexto, mo = (v) => ({ v: v / 100, t: 'money' }), H = (a) => a.map((v) => ({ v, t: 'head' })), t = totaisLote(L), previa = !!r0.previa;
    const dem = [[{ v: (previa ? 'PRÉVIA NÃO OFICIAL - ' : '') + 'Demonstrativo de premiação - KarneKeijo / Setor de Compras', t: 'bold' }]];
    if (previa) dem.push([{ v: 'Baseada no PAD diário de ' + c.posicaoTexto + ' (acumulado parcial). O valor oficial só sai com o PAD de fechamento.', t: 'bold' }]);
    dem.push([], H(['IDENTIFICAÇÃO', '']), ['Colaborador', r0.cargo], ['Gestor(es) (indicadores)', gestoresTxt(L)], ['Mês de referência', c.periodoTexto + (previa ? ' (posição ' + c.posicaoTexto + ')' : '')], ['Salário bruto informado', mo(r0.salarioCent)], ['Arquivo PAD utilizado', c.arquivo + (previa ? ' (PAD diário)' : ' (fechamento, versão ' + c.versaoFechamento + ')')], [],
      H(['RESUMO POR CATEGORIA', 'Atingimento', 'Faixa', '% final', 'Premiação'].concat(previa ? ['Projeção fim do mês (estimativa)'] : [])));
    L.recs.forEach((x) => { const r = x.resultado, i = r.indicadores[0]; dem.push([r.categoriaNome, { v: i.atingimento, t: 'pct' }, i.faixa, { v: r.pctTotal, t: 'pct' }, mo(r.valorCent)].concat(previa ? [r.projecao ? mo(r.projecao.valorCent) : ''] : [])); });
    L.falhas.forEach((f) => dem.push([f.categoriaNome, f.tipo === 'naoAplica' ? 'NÃO SE APLICA' : 'NÃO CALCULADA', f.bloqueios.join(' ')]));
    const sub = M.subtotais(L.recs.map((x) => x.resultado)); if (sub.Distribuição !== null && sub.Lojas !== null) dem.push(['Subtotal Distribuição', '', '', '', mo(sub.Distribuição)], ['Subtotal Lojas (Deskontão)', '', '', '', mo(sub.Lojas)]);
    if (t.ajustes.length) { dem.push(['Total das categorias', '', '', '', mo(t.totalBrutoCent)]); t.ajustes.forEach((a) => dem.push([a.rotulo, '', '', '', mo(a.valorCent)])); }
    dem.push([{ v: (previa ? 'TOTAL DA PRÉVIA' : 'TOTAL DA PREMIAÇÃO'), t: 'bold' }, '', '', '', mo(t.totalCent)].concat(previa && t.totalProjCent != null ? [mo(t.totalProjCent)] : []), []);
    L.recs.forEach((x) => {
      const r = x.resultado;
      dem.push(H([r.categoriaNome.toUpperCase(), 'Resultado no PAD', 'Meta', 'Atingimento', 'Faixa alcançada', 'Critério']));
      r.indicadores.forEach((i) => dem.push([i.nome, { v: r2(i.resultado), t: 'money' }, i.meta !== null ? { v: r2(i.meta), t: 'money' } : '', i.atingimento !== null ? { v: i.atingimento, t: 'pct' } : '', i.faixa, i.atendido ? 'Atendido' : 'Não atendido']));
      dem.push(['% da faixa', { v: r.pctFaixa, t: 'pct' }], ['Adicional da escala (p.p.)', { v: r.pctEscala, t: 'pct' }], ['% de premiação alcançado', { v: r.pctTotal, t: 'pct' }], [{ v: 'Valor da premiação', t: 'bold' }, mo(r.valorCent)]);
      if (r.proximos) { if (r.proximos.faixa) dem.push(['Falta p/ próxima faixa (' + r.proximos.faixa.rotulo + ')', mo(r.proximos.faixa.falta * 100)]); if (r.proximos.degrau) dem.push(['Falta p/ próximo degrau da escala', mo(r.proximos.degrau.falta * 100)]); }
      dem.push([]);
    });
    dem.push(['Calculado em', fmtData(L.criadoEm)], ['Regras', R.fonte + ' - versão ' + r0.regrasVersao + ' (' + r0.regrasVigencia + ')'], ['Código do cálculo', L.loteId]);
    const mem = [[{ v: 'Memória de cálculo', t: 'bold' }], []];
    L.recs.forEach((x) => { mem.push([{ v: '=== ' + x.resultado.categoriaNome + ' ===', t: 'bold' }]); x.resultado.memoria.forEach((m) => { mem.push([{ v: m.titulo, t: 'bold' }]); m.linhas.forEach((l) => mem.push([l])); mem.push([]); }); });
    return [{ nome: 'Demonstrativo', linhas: dem, larguras: [44, 22, 40, 14, 40, 16] }, { nome: 'Memória de cálculo', linhas: mem, larguras: [140] }];
  }
  function xlsxLote(L) { baixa(KK_XLSX.writeXlsx(linhasLote(L)), nomeBase(L) + '.xlsx'); }
  function xlsxHistorico() {
    const hist = store.get(KH, []);
    const linhas = [['Data do cálculo', 'Tipo', 'Posição do PAD diário', 'Mês de referência', 'Colaborador', 'Código', 'Gestor', 'Categoria', 'Salário bruto informado', '% alcançado', 'Valor da premiação (antes dos ajustes)', 'Arquivo PAD', 'Versão do fechamento', 'Regras (versão)'].map((v) => ({ v, t: 'head' }))];
    hist.forEach((x) => { const r = x.resultado, c = r.contexto; linhas.push([fmtData(x.criadoEm), r.previa ? 'Prévia (não oficial)' : 'Oficial', c.posicaoTexto || '', c.periodoTexto, r.cargo || 'Gestor', r.gestor.codigo, r.gestor.nome, r.categoriaNome, { v: r.salarioCent / 100, t: 'money' }, { v: r.pctTotal, t: 'pct' }, { v: r.valorCent / 100, t: 'money' }, c.arquivo, c.versaoFechamento || '', r.regrasVersao]); });
    baixa(KK_XLSX.writeXlsx([{ nome: 'Histórico', linhas, larguras: [18, 20, 14, 18, 12, 10, 26, 34, 22, 12, 24, 40, 12, 14] }]), 'Historico_Premiacoes.xlsx');
  }
  function imprimir(comoPdf) {
    const t = document.title;
    if (comoPdf && S.lote) document.title = nomeBase(S.lote);
    window.print(); setTimeout(() => { document.title = t; }, 800);
  }

  // ---------- eventos ----------
  document.addEventListener('click', (e) => {
    const go_ = e.target.closest('[data-go]'); if (go_) { go(go_.dataset.go); return; }
    const ver = e.target.closest('[data-ver]'); if (ver) { abreRegistro(ver.dataset.ver); return; }
    const det = e.target.closest('[data-detalhe]'); if (det) { S.lote = S.multi.itens[+det.dataset.detalhe].lote; S.loteReadonly = false; S.voltarPara = 'resm'; go('res'); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'confirmar-pad') confirmarPad(false);
    else if (act === 'substituir') confirmarPad(true);
    else if (act === 'cancelar-subst') { S.conflito = null; renderImport(); }
    else if (act === 'trocar') { resetPad(); refresh(); }
    else if (act === 'todas') { S.cats = catsAplicaveis(gestoresSel()).map((c) => c.id); renderSel(); renderConf(); renderSal(); }
    else if (act === 'limpar-cats') { S.cats = []; renderSel(); renderConf(); renderSal(); }
    else if (act === 'calcular') calcular();
    else if (act === 'add-linha') { S.linhas.push(novaLinha()); renderLinhas(); }
    else if (act === 'rm-linha') { S.linhas.splice(+a.dataset.i, 1); renderLinhas(); }
    else if (act === 'calcular-multi') calcularMulti();
    else if (act === 'xlsx-multi') xlsxMulti();
    else if (act === 'novo') { S.lote = null; resetCalc(); go('calc'); }
    else if (act === 'pdf') imprimir(true);
    else if (act === 'print') imprimir(false);
    else if (act === 'xlsx') xlsxLote(S.lote);
    else if (act === 'xlsx-hist') xlsxHistorico();
    else if (act === 'ver-evolucao') verEvolucao();
    else if (act === 'rm-dia') { const x = store.get(KA, { dias: {} }); delete x.dias[a.dataset.dia]; store.set(KA, x); S.ac.log = []; renderAc1(); renderAc2(); }
    else if (act === 'backup') exportaBackup();
    else if (act === 'restaurar') $('#bkfile').click();
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { if (!e.target.closest('#drop') && !e.target.closest('#adrop')) e.preventDefault(); });

  shell(); go('home');
  window.__KK = { S, store, KH, KP, KA }; // apoio a testes
})();

</script>
